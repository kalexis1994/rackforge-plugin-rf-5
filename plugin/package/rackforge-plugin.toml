schema_version = 2
id = "org.rackforge.rf-5"
name = "RF-5"
vendor = "RackForge Community"
version = "0.1.0"
kind = "instrument"
state_version = 13
capabilities = [
    "audio_output",
    "midi_input",
    "presets",
    "state",
    "sample_accurate_automation",
]
ui_layouts = ["little@1"]
config_mode = false

[midi]
channel_model = "single_part"
program_change = "ignore"

[[midi.input_buses]]
id = "main"
name = "Main"

[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[api]
major = 1
minor = 8

[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#252323"
accent_color = "#C33A2C"

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"
