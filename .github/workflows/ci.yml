name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rf-5-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test release DSP
        run: cargo test --release --workspace
      - name: Build portable processor
        run: cargo build --locked --release -p rackforge-rf-5 --target wasm32-unknown-unknown

  rfplugin:
    name: Portable .rfplugin
    needs: rust
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out RF-5
        uses: actions/checkout@v6
      - name: Check out the pinned RackForge packager
        uses: actions/checkout@v6
        with:
          repository: kalexis1994/rackforge
          ref: 37915a58529b5f57508207fb5f936c279afa0944
          path: .rackforge
          persist-credentials: false
      - name: Set up Rust and WebAssembly target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Cache Cargo dependencies and build outputs
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            .rackforge/target
          key: ${{ runner.os }}-${{ runner.arch }}-rf-5-package-${{ hashFiles('Cargo.lock', '.rackforge/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-rf-5-package-
      - name: Build portable RF-5 package
        id: package
        env:
          RACKFORGE_ROOT: ${{ github.workspace }}/.rackforge
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' plugin/package/rackforge-plugin.toml | head -n 1)"
          test -n "$version"
          output="$GITHUB_WORKSPACE/artifacts/RF-5.rfplugin"
          bash tools/build-package.sh "$output"
          digest="$(sha256sum "$output" | awk '{print $1}')"
          printf '%s  %s\n' "$digest" "$(basename "$output")" > "$output.sha256"
          echo "artifact_name=RF-5-$version-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "artifact=$output" >> "$GITHUB_OUTPUT"
      - name: Upload RF-5 package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.artifact }}
            ${{ steps.package.outputs.artifact }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
