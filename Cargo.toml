[workspace]
resolver = "3"
members = [
    "crates/rf-5-contract",
    "crates/rf-5-voice",
    "crates/rf-5-dsp",
    "crates/rf-5-audition",
    "plugin",
    "plugin-ui",
]

[workspace.package]
version = "0.1.14"
edition = "2024"
license = "GPL-3.0-only"
repository = "https://github.com/kalexis1994/rackforge-plugin-rf-5"

[workspace.dependencies]
rf-5-contract = { path = "crates/rf-5-contract" }
rf-5-voice = { path = "crates/rf-5-voice", default-features = false }
rf-5-dsp = { path = "crates/rf-5-dsp", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Portable RackForge ABI used by the processor adapter. Local contributors can
# override this revision with `.cargo/config.toml.example`.
rackforge-plugin-sdk = { git = "https://github.com/kalexis1994/rackforge.git", rev = "03fdb0ea75850405cf57683ae957eec109e85daa" }

[profile.release]
# The portable WebAssembly processor benefits materially from whole-program
# inlining across the voice, engine and RackForge ABI crates. These settings
# produce one component shared by every RackForge platform.
lto = "fat"
codegen-units = 1
panic = "abort"
