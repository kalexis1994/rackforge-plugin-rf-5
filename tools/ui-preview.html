<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RF-5 UI Preview Host</title>
    <style>
      html, body, iframe { width: 100%; min-height: 100%; margin: 0; border: 0; background: #101010; }
      iframe { position: fixed; inset: 0; height: 100%; }
    </style>
  </head>
  <body>
    <iframe id="surface" src="../plugin/package/web/play.html" title="RF-5 Play surface"></iframe>
    <script type="module">
      const protocol = "rackforge.plugin.web@1";
      const frame = document.querySelector("#surface");
      const [schema, catalog] = await Promise.all([
        fetch("../plugin/package/metadata/parameters.json").then((response) => response.json()),
        fetch("../plugin/package/metadata/presets.json").then((response) => response.json()),
      ]);
      const sounds = catalog.presets.map((preset) => ({
        id: preset.id,
        name: preset.name,
        bank: preset.bank,
        editable: false,
      }));
      // Programs recorded in the preview, as RackForge's CUSTOM collection.
      let draft = null;
      let draftCounter = 0;
      let customCounter = 0;
      const values = new Map(schema.parameters.map((parameter) => [
        parameter.index,
        typeof parameter.kind.default === "boolean"
          ? Number(parameter.kind.default)
          : parameter.kind.default,
      ]));
      let selectedSoundId = sounds[0]?.id ?? "";
      window.__consoleErrors = [];
      window.addEventListener("error", (event) => window.__consoleErrors.push(String(event.message)));

      // RackForge injects its plugin kit (<rf-program-select>,
      // <rf-program-save>) into every plugin frame; the preview does the same
      // with a copy of the host's build, from
      // ../rackforge/web/dist/rackforge-plugin-kit/ (all its files).
      const injectPluginKit = () => {
        for (const name of ["program-select", "program-save"]) {
          const script = frame.contentDocument.createElement("script");
          script.type = "module";
          script.src = new URL(`rackforge-plugin-kit/${name}.js?v=${Date.now()}`, location.href).href;
          frame.contentDocument.head.append(script);
        }
      };
      if (frame.contentDocument?.readyState === "complete") injectPluginKit();
      frame.addEventListener("load", injectPluginKit);

      const send = (message) => frame.contentWindow.postMessage(message, location.origin);
      const sendContext = () => send({
        protocol,
        kind: "context",
        instance: { selected_sound_id: selectedSoundId, sounds },
        program_draft: draft,
      });
      const respond = (requestId, result) => send({
        protocol,
        kind: "response",
        request_id: requestId,
        ok: true,
        result,
      });

      window.addEventListener("message", (event) => {
        if (event.source !== frame.contentWindow || event.origin !== location.origin) return;
        const message = event.data;
        if (!message || message.protocol !== protocol) return;
        if (message.kind === "ready") {
          sendContext();
          return;
        }
        if (message.kind !== "request") return;
        if (message.method === "plugin.parameters") {
          respond(message.request_id, {
            schema,
            values: schema.parameters.map((parameter) => ({
              index: parameter.index,
              value: values.get(parameter.index),
            })),
          });
        } else if (message.method === "plugin.set_parameter") {
          values.set(message.params.parameter_index, message.params.value);
          respond(message.request_id, {});
          send({
            protocol,
            kind: "parameter_changed",
            parameter_index: message.params.parameter_index,
            value: message.params.value,
          });
        } else if (message.method === "plugin.begin_program_edit") {
          const original = message.params.program_id;
          const source = sounds.find((sound) => sound.id === (original ?? selectedSoundId));
          draftCounter += 1;
          draft = {
            draft_id: draftCounter,
            name: source?.name ?? "New program",
            ...(original ? { original_program_id: original } : {}),
            dirty: false,
          };
          respond(message.request_id, null);
          sendContext();
        } else if (message.method === "plugin.set_program_name" && draft?.draft_id === message.params.draft_id) {
          draft = { ...draft, name: String(message.params.name).trim(), dirty: true };
          respond(message.request_id, null);
          sendContext();
        } else if (message.method === "plugin.save_program" && draft?.draft_id === message.params.draft_id) {
          const original = sounds.find((sound) => sound.id === draft.original_program_id);
          if (original) {
            original.name = draft.name;
            selectedSoundId = original.id;
          } else {
            customCounter += 1;
            const id = `custom.preview-${customCounter}`;
            sounds.push({ id, name: draft.name, bank: "custom", editable: true });
            selectedSoundId = id;
          }
          draft = null;
          respond(message.request_id, null);
          sendContext();
        } else if (message.method === "plugin.cancel_program" && draft?.draft_id === message.params.draft_id) {
          draft = null;
          respond(message.request_id, null);
          sendContext();
        } else if (message.method === "plugin.select_sound") {
          selectedSoundId = message.params.sound_id;
          respond(message.request_id, {});
          sendContext();
        }
      });
    </script>
  </body>
</html>
