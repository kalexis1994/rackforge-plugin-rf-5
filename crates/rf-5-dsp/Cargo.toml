[package]
name = "rf-5-dsp"
description = "Five-voice MIDI and audio engine for RF-5"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["portable-realtime"]
portable-realtime = ["rf-5-voice/portable-realtime"]
host-rate = ["rf-5-voice/host-rate"]
two-times = ["rf-5-voice/two-times"]
hybrid-four-two = ["rf-5-voice/hybrid-four-two"]
held-filter-two-times = ["rf-5-voice/held-filter-two-times"]
delayed-low-resonance = ["rf-5-voice/delayed-low-resonance"]
fast-math = ["rf-5-voice/fast-math"]
diagnostic-programs = []

[dependencies]
rf-5-contract.workspace = true
rf-5-voice = { workspace = true, default-features = false }
libm = "0.2"
